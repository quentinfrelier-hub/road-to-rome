<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B0F1A">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>html{box-sizing:border-box;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px);background:#0B0F1A}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Road to Rome</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Press+Start+2P&family=Space+Grotesk:wght@500;700&display=swap">
<style>
/* Layout: one-screen phone app — sticky screen header, scrolling body, fixed 5-tab bar. Single dark neon world (deliberate). */
:root{
  --bg:#0B0F1A; --bg2:#10142a; --panel:#141936; --panel2:#1b2148; --line:#2c2f63;
  --violet:#6A00FF; --violet2:#8B4DFF; --pink:#FF2D95; --lime:#C6FF00; --cyan:#00E5FF; --orange:#FF8A00;
  --fg:#F2F4F8; --muted:#a3a1d6; --dim:#5f5d93;
  --f-title:"Space Grotesk","Inter",system-ui,sans-serif;
  --f-px:"Press Start 2P","Courier New",monospace;
  --f-body:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;overflow:hidden;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.app{position:relative;height:100%;display:flex;flex-direction:column;background:
  radial-gradient(120% 60% at 100% 0%,rgba(106,0,255,.28),transparent 60%),
  radial-gradient(90% 50% at 0% 100%,rgba(255,45,149,.16),transparent 60%),var(--bg)}
.screen{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 96px}
.screen[hidden]{display:none!important}
.hdr{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;padding-block:14px 12px;background:linear-gradient(var(--bg) 70%,transparent)}
.hdr h1{font-family:var(--f-title);font-weight:700;font-style:italic;font-size:22px;letter-spacing:.02em;margin:0;text-transform:uppercase;text-shadow:0 0 18px rgba(139,77,255,.6)}
.hdr .sub{font-size:12px;color:var(--muted);margin-left:auto;text-align:right}
.hdr .ic{width:26px;height:26px;color:var(--pink);filter:drop-shadow(0 0 6px rgba(255,45,149,.7))}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.px{font-family:var(--f-px);letter-spacing:.02em}
.card{background:linear-gradient(180deg,rgba(27,33,72,.92),rgba(20,25,54,.92));border:1px solid var(--line);border-radius:14px;padding:14px;position:relative}
.glow{border-color:rgba(139,77,255,.7);box-shadow:0 0 0 1px rgba(139,77,255,.25),0 0 22px rgba(106,0,255,.35)}
.lbl{font-family:var(--f-title);font-weight:700;font-style:italic;text-transform:uppercase;font-size:13px;letter-spacing:.06em;color:var(--fg);display:flex;align-items:center;gap:8px;margin:0 0 10px}
.lbl .i{width:16px;height:16px;color:var(--pink)}
.stack{display:flex;flex-direction:column;gap:12px}
.bar{height:10px;border-radius:6px;background:#0a0d1f;border:1px solid var(--line);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--violet),var(--pink));box-shadow:0 0 12px rgba(255,45,149,.7);transition:width .6s cubic-bezier(.2,.8,.2,1)}
.bar.lime>i{background:linear-gradient(90deg,#7bd100,var(--lime));box-shadow:0 0 12px rgba(198,255,0,.6)}
.num{font-variant-numeric:tabular-nums}

/* ---------- QG ---------- */
.hero{display:grid;grid-template-columns:132px 1fr;gap:14px;align-items:center;padding:12px}
.portrait{position:relative;width:132px;aspect-ratio:1;border-radius:14px;overflow:hidden;border:1px solid rgba(255,45,149,.7);box-shadow:0 0 24px rgba(255,45,149,.35)}
.portrait img{width:100%;height:100%;object-fit:cover;display:block}
.portrait .spr{position:absolute;right:5px;bottom:5px;width:40px;border-radius:7px;border:1.5px solid var(--lime);image-rendering:pixelated;filter:drop-shadow(0 0 4px #000)}
.lvl{font-family:var(--f-px);font-size:20px;color:var(--fg);text-shadow:0 0 12px rgba(198,255,0,.5)}
.rank{font-family:var(--f-title);font-weight:700;font-style:italic;font-size:17px;text-transform:uppercase;color:var(--lime);margin:6px 0 10px;line-height:1.1}
.xpline{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-bottom:5px}
.goal{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center}
.goal .flag{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:rgba(255,138,0,.12);color:var(--orange);border:1px solid rgba(255,138,0,.5)}
.goal h3{margin:0;font-family:var(--f-title);font-size:16px;text-transform:uppercase;font-style:italic}
.goal p{margin:2px 0 0;color:var(--muted);font-size:12px}
.goal .jx{text-align:right}
.goal .jx b{display:block;font-family:var(--f-px);font-size:15px;color:var(--orange)}
.goal .jx span{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tile{background:rgba(10,13,31,.6);border:1px solid var(--line);border-radius:10px;padding:10px 6px;text-align:center}
.tile .i{width:20px;height:20px;color:var(--cyan);margin:0 auto 4px;display:block}
.tile b{display:block;font-size:15px;font-variant-numeric:tabular-nums}
.tile span{font-size:10px;color:var(--muted)}
.attrs{display:grid;gap:9px}
.attr{display:grid;grid-template-columns:24px 92px 1fr 30px;align-items:center;gap:8px;font-size:13px}
.attr .i{width:18px;height:18px}
.attr b{text-align:right;font-variant-numeric:tabular-nums}
.today{display:flex;gap:12px;align-items:center}
.today .ico{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:rgba(198,255,0,.1);border:1px solid rgba(198,255,0,.5);color:var(--lime);flex:none}
.today h4{margin:0;font-size:15px}
.today p{margin:2px 0 0;font-size:12px;color:var(--muted)}
.cta{margin-left:auto;flex:none;padding:8px 12px;border-radius:10px;background:var(--violet);font-weight:600;font-size:12px;box-shadow:0 0 14px rgba(106,0,255,.6)}
.world{display:flex;align-items:center;gap:12px}
.world .i{width:30px;height:30px;color:var(--violet2)}

/* ---------- MISSIONS ---------- */
.wknav{display:flex;align-items:center;gap:6px}
.wknav button{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;border:1px solid var(--line);background:var(--panel)}
.wknav button:disabled{opacity:.3}
.wkhead{flex:1;text-align:center}
.wkhead b{font-family:var(--f-title);font-size:19px;font-style:italic;text-transform:uppercase}
.wkhead div{font-size:12px;color:var(--muted);margin-top:2px}
.wkmeta{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted);margin:2px 0 6px}
.wkmeta b{color:var(--lime);font-family:var(--f-px);font-size:11px}
.note{font-size:12px;color:var(--muted);line-height:1.5;padding:10px 12px;border-left:2px solid var(--cyan);background:rgba(0,229,255,.06);border-radius:0 10px 10px 0}
.ms{display:grid;grid-template-columns:40px 1fr auto;gap:12px;align-items:center;padding:12px;border-radius:12px;border:1px solid var(--line);background:rgba(20,25,54,.9);transition:border-color .2s,background .2s}
.ms .ico{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;border:1px solid currentColor;background:rgba(255,255,255,.03)}
.ms .t{min-width:0}
.ms .t .d{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);display:flex;gap:6px;align-items:center}
.ms .t .d .now{color:var(--bg);background:var(--lime);border-radius:4px;padding:1px 5px;font-weight:700;letter-spacing:.06em}
.ms .t h4{margin:2px 0 2px;font-size:15px;font-weight:600}
.ms .t p{margin:0;font-size:12px;color:var(--muted);line-height:1.4}
.ms .t .xp{font-family:var(--f-px);font-size:9px;color:var(--lime);margin-top:5px;display:block}
.chk{width:34px;height:34px;border-radius:9px;border:2px solid var(--dim);display:grid;place-items:center;color:transparent;transition:all .2s}
.ms.done{border-color:rgba(198,255,0,.55);background:linear-gradient(90deg,rgba(198,255,0,.08),rgba(20,25,54,.9))}
.ms.done .chk{background:var(--lime);border-color:var(--lime);color:var(--bg);box-shadow:0 0 14px rgba(198,255,0,.6)}
.ms.ro .chk{cursor:default}
.pips{display:flex;gap:6px;margin-top:8px}
.pip{width:30px;height:30px;border-radius:8px;border:2px solid var(--dim);display:grid;place-items:center;font-size:10px;font-weight:700;color:var(--muted)}
.pip.on{background:var(--cyan);border-color:var(--cyan);color:var(--bg);box-shadow:0 0 10px rgba(0,229,255,.6)}
.chrono{display:flex;gap:8px;margin-top:8px;align-items:center}
.chrono input{width:110px;background:#0a0d1f;border:1px solid var(--line);border-radius:8px;color:var(--fg);padding:7px 9px;font:inherit;font-variant-numeric:tabular-nums}
.chrono button{padding:7px 10px;border-radius:8px;background:var(--panel2);border:1px solid var(--line);font-size:12px}
.validate{width:100%;padding:16px;border-radius:16px;font-family:var(--f-title);font-weight:700;font-style:italic;text-transform:uppercase;font-size:17px;letter-spacing:.04em;background:linear-gradient(90deg,var(--violet),var(--pink));box-shadow:0 0 24px rgba(255,45,149,.5);border:1px solid rgba(255,255,255,.2)}
.validate small{display:block;font-family:var(--f-px);font-style:normal;font-size:10px;margin-top:6px;color:var(--lime)}
.validate.part{background:var(--panel2);box-shadow:none;border:1px dashed var(--muted)}
.validated{text-align:center;padding:14px;border-radius:14px;border:1px solid rgba(198,255,0,.5);color:var(--lime);font-family:var(--f-title);font-weight:700;text-transform:uppercase;font-style:italic}
.locked{text-align:center;padding:36px 16px}
.locked .i{width:44px;height:44px;color:var(--dim);margin:0 auto 10px;display:block}
.locked h3{font-family:var(--f-title);font-style:italic;text-transform:uppercase;margin:0 0 6px}
.locked p{color:var(--muted);margin:0;font-size:13px}

/* ---------- CARTE ---------- */
#s-map{padding:0;display:flex;flex-direction:column;overflow:hidden;padding-bottom:78px}
#s-map .hdr{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));position:relative}
.mapwrap{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;position:relative;background:#05060e;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.mapwrap::-webkit-scrollbar{display:none}
.mapin{position:relative;width:100%;aspect-ratio:941/1672}
.mapin>img.lockimg{filter:grayscale(1) brightness(.62) contrast(1.1)}
.mapin>img.fog{filter:grayscale(1) brightness(.62) contrast(1.1);-webkit-mask-size:100% 100%;mask-size:100% 100%;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;pointer-events:none}
.mapbtn{margin-left:auto;width:44px;height:44px;border-radius:12px;display:grid;place-items:center;color:var(--lime);border:1.5px solid var(--lime);background:rgba(198,255,0,.08);box-shadow:0 0 14px rgba(198,255,0,.45),inset 0 0 10px rgba(198,255,0,.2);animation:mapglow 2.4s ease-in-out infinite}
.mapbtn .i{width:24px;height:24px}
@keyframes mapglow{50%{box-shadow:0 0 22px rgba(198,255,0,.8),inset 0 0 12px rgba(198,255,0,.3)}}
.zonebar{display:flex;align-items:center;gap:10px;padding:0 max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px))}
.zonebar>button{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;border:1px solid var(--line);background:var(--panel);flex:none}
.zonebar>button:disabled{opacity:.3}
.zonebar .zi{flex:1;min-width:0}
.zonebar .zt{display:flex;justify-content:space-between;gap:8px;align-items:baseline;margin-bottom:5px}
.zonebar .zt b{font-family:var(--f-title);font-style:italic;text-transform:uppercase;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.zonebar .zt span{font-size:11px;color:var(--muted);white-space:nowrap}
.zonebar .zt span.cur{color:var(--pink)}.zonebar .zt span.ok{color:var(--lime)}
.mapfull{position:fixed;inset:0;z-index:45;background:#05060e;display:flex;flex-direction:column;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px);animation:mfin .35s cubic-bezier(.2,.9,.3,1) both}
@keyframes mfin{from{opacity:0;transform:scale(1.06)}}
.mf-hdr{display:flex;align-items:center;gap:10px;padding:12px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px))}
.mf-hdr h3{margin:0;font-family:var(--f-title);font-style:italic;text-transform:uppercase;font-size:18px;text-shadow:0 0 14px rgba(139,77,255,.7)}
.mf-hdr span{font-size:11px;color:var(--muted)}
.mf-hdr button{margin-left:auto;padding:9px 14px;border-radius:10px;border:1px solid var(--line);background:var(--panel);font-weight:600;font-size:13px}
.mf-scroll{flex:1;min-height:0;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;position:relative;border-block:1px solid var(--line)}
.mf-scroll::-webkit-scrollbar{display:none}
.mf-scroll .mapin{position:relative;height:100%;width:auto;aspect-ratio:2170/725;max-width:none}
.mf-scroll .wlbl{font-size:12px}
.mf-scroll .dot{pointer-events:none}
.mf-leg{display:flex;gap:14px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--muted);padding:10px max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px))}
.mf-leg i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-2px}
.mf-leg .c1{background:linear-gradient(135deg,#3aa655,#3b6fd9,#e0b23a)}.mf-leg .c2{background:#4a4a52}
.mf-leg b{margin-left:auto;color:var(--lime);font-family:var(--f-px);font-size:10px}
.mapin>img{position:absolute;inset:0;width:100%;height:100%;display:block;user-select:none;-webkit-user-drag:none}
.mapin>svg{position:absolute;inset:0;width:100%;height:100%}
.dot{cursor:pointer}
.hud{position:absolute;left:62.6%;top:2%;width:35.2%;height:23.6%;background:rgba(11,15,26,.96);border:1.5px solid var(--violet2);border-radius:10px;box-shadow:0 0 18px rgba(106,0,255,.6);padding:2.2% 2.6%;display:flex;flex-direction:column;justify-content:space-between;font-size:clamp(9px,1.6vh,14px)}
.hud .h{font-family:var(--f-title);font-weight:700;text-transform:uppercase;display:flex;justify-content:space-between}
.hud .h b{font-family:var(--f-px);color:var(--lime);font-size:.95em}
.hud .r{display:flex;justify-content:space-between;color:var(--muted);font-size:.9em}
.hud .r b{color:var(--fg);display:block;font-size:1.15em}
.runner{position:absolute;width:clamp(40px,6.4%,78px);transform:translate(-50%,-92%);transition:left 1s cubic-bezier(.3,.8,.2,1),top 1s cubic-bezier(.3,.8,.2,1);pointer-events:none;z-index:2}
.runner img{width:100%;display:block;image-rendering:pixelated;border-radius:8px;border:2px solid var(--lime);box-shadow:0 0 12px var(--lime),0 4px 8px #000;animation:bob .7s steps(2) infinite}
.runner::after{content:"";position:absolute;left:50%;bottom:-7px;transform:translateX(-50%);border:6px solid transparent;border-top-color:var(--lime)}
@keyframes bob{50%{transform:translateY(-3px)}}
.wlbl{position:absolute;transform:translate(-50%,-50%);font-size:clamp(8px,1.5vh,12px);font-weight:700;padding:3px 7px;border-radius:6px;background:rgba(11,15,26,.92);border:1px solid var(--lime);color:var(--lime);white-space:nowrap;font-family:var(--f-title);text-transform:uppercase;pointer-events:none}
.wlbl.cur{border-color:var(--pink);color:var(--pink);box-shadow:0 0 10px rgba(255,45,149,.6)}
.wlbl.lock{border-color:var(--dim);color:var(--muted)}
.mapinfo{padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));display:flex;gap:12px;align-items:center;min-height:66px}
.mapinfo .ico{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;border:1px solid currentColor;flex:none}
.mapinfo h4{margin:0;font-size:14px}
.mapinfo p{margin:2px 0 0;font-size:12px;color:var(--muted)}
.maphint{font-size:11px;color:var(--muted);text-align:right;margin-left:auto}
@keyframes pulse{0%,100%{r:7}50%{r:10}}
.pulse{animation:pulse 1.2s ease-in-out infinite}

/* ---------- INVENTAIRE ---------- */
.inv{display:grid;grid-template-columns:56px 1fr 56px;gap:10px;align-items:center}
.slots{display:flex;flex-direction:column;gap:8px}
.slot{width:56px;height:56px;border-radius:14px;display:grid;place-items:center;position:relative;border:1.5px solid var(--cyan);background:rgba(0,229,255,.06);box-shadow:inset 0 0 14px rgba(0,229,255,.15);color:var(--cyan)}
.slot .i{width:27px;height:27px}
.slot.r2{border-color:var(--violet2);color:var(--violet2);background:rgba(139,77,255,.08)}
.slot.r3{border-color:var(--pink);color:var(--pink);background:rgba(255,45,149,.08)}
.slot.r4{border-color:var(--lime);color:var(--lime);background:rgba(198,255,0,.07)}
.slot.r5{border-color:var(--orange);color:var(--orange);background:rgba(255,138,0,.1);box-shadow:0 0 16px rgba(255,138,0,.4)}
.slot.empty{border-style:dashed;border-color:var(--dim);color:var(--dim);background:none;box-shadow:none}
.slot .n{position:absolute;right:-4px;top:-6px;min-width:18px;height:18px;border-radius:9px;background:var(--pink);font-size:10px;font-weight:700;display:grid;place-items:center;padding:0 4px;color:#fff}
.avatar{position:relative;aspect-ratio:3/4;border-radius:16px;overflow:hidden;border:1px solid rgba(139,77,255,.6);box-shadow:0 0 30px rgba(106,0,255,.4)}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}
.avatar .cap{position:absolute;inset:auto 0 0;padding:28px 10px 10px;background:linear-gradient(transparent,rgba(11,15,26,.95));text-align:center}
.avatar .cap b{font-family:var(--f-title);font-style:italic;text-transform:uppercase;font-size:15px;color:var(--lime)}
.avatar .cap span{display:block;font-size:10px;color:var(--muted);font-family:var(--f-px);margin-top:4px}
.bonus{display:grid;grid-template-columns:repeat(4,1fr);text-align:center}
.bonus div{border-right:1px solid var(--line)}
.bonus div:last-child{border:0}
.bonus .i{width:20px;height:20px;margin:0 auto 4px;display:block}
.bonus span{font-size:11px;color:var(--muted);display:block}
.bonus b{color:var(--lime);font-size:15px;font-variant-numeric:tabular-nums}
.items{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.item{border:1px solid var(--line);border-radius:12px;padding:10px 4px 8px;text-align:center;background:rgba(10,13,31,.5);position:relative;font-size:10.5px;line-height:1.25}
.item .i{width:26px;height:26px;margin:0 auto 6px;display:block}
.item.lock{opacity:.45}
.item.on{border-color:var(--lime);box-shadow:0 0 12px rgba(198,255,0,.35)}
.item small{display:block;color:var(--muted);margin-top:3px;font-size:9.5px}
.item .win{position:absolute;top:5px;right:5px;color:var(--cyan)}
.item .win .i{width:12px;height:12px;margin:0}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:-2px 0 12px}
.chip{display:inline-flex;align-items:center;gap:4px;padding:6px 10px;border-radius:999px;border:1px solid var(--line);font-size:12px;color:var(--muted)}
.chip .i{width:13px;height:13px}
.chip.on{border-color:var(--violet2);background:rgba(139,77,255,.18);color:var(--fg)}

/* ---------- SUCCÈS ---------- */
.final{text-align:center;padding:20px 14px;overflow:hidden}

const RANKS=[

function calc(){ migrateEq();
  let xp=0,runsDone=0,km=0,slMax=0,muscu=0,foot=0,q=0,ef=0,sl=0,perfect=0,weeksVal=0,streak=0,best=0;
  const marathon=!!S.done['w18r2'];
  WEEKS.forEach(w=>{
    w.ms.forEach(m=>{ if(S.done[m.id]){ xp+=m.xp; if(m.kind==='run'){runsDone++;km+=m.km; if(m.type==='sl')sl++,slMax=Math.max(slMax,m.km); if(m.type==='q')q++; if(m.type==='ef')ef++;} else muscu++; } });
    const f=Math.min(S.foot[w.n]||0,w.foot); foot+=f; xp+=f*XP.foot; km+=f*2.2;
    const v=S.val[w.n]; if(v){weeksVal++; xp+=v.perfect?XP.perfect:XP.partial; if(v.perfect){perfect++;streak++;best=Math.max(best,streak)} else streak=0;}
  });
  let level=50; while(level<99&&xp>=LV(level+1)) level++; if(marathon) level=100;
  const r=[...RANKS].reverse().find(r=>level>=r.min); const ri=RANKS.indexOf(r);
  const cur=WEEKS.find(w=>!S.val[w.n])||null;
  const worldsDone=WORLDS.filter(W=>S.val[W.weeks[1]]).length;
  const chronoSec=parseChrono(S.chrono);
  return {xp,level,lvFrom:LV(level),lvTo:LV(level+1),rankName:marathon?'Gladiateur de Rome':r.name,por:marathon?5:ri,spr:marathon?5:r.spr,runsDone,km:Math.round(km),slMax,muscu,foot,q,ef,sl,perfect,weeksVal,bestStreak:best,cur,marathon,worldsDone,chronoSec};
}
function parseChrono(s){ if(!s)return null; let t=String(s).trim().toLowerCase().replace(/\s+/g,'');
  if(/^\d{5,6}$/.test(t)){ const p=t.padStart(6,'0'); return (+p.slice(0,2))*3600+(+p.slice(2,4))*60+(+p.slice(4,6)); }
  const m=t.match(/^(\d{1,2})[:h.,'](\d{1,2})(?:[:m.,'"](\d{1,2}))?s?$/); if(!m||+m[2]>59||+(m[3]||0)>59)return null; return (+m[1])*3600+(+m[2])*60+(+(m[3]||0)); }
const fmtChrono=sec=>`${Math.floor(sec/3600)}:${String(Math.floor(sec%3600/60)).padStart(2,'0')}:${String(sec%60).padStart(2,'0')}`;
function weekDone(w){ const all=w.ms.every(m=>S.done[m.id]); return {all:all&&(S.foot[w.n]||0)>=w.foot, n:w.ms.filter(m=>S.done[m.id]).length+Math.min(S.foot[w.n]||0,w.foot), tot:w.ms.length+w.foot}; }
function weekXP(w){ return w.ms.reduce((s,m)=>s+m.xp,0)+w.foot*XP.foot+XP.perfect; }

function nextMission(c){
  const w=c.cur; if(!w) return null;
  const ti=todayIdx(), wd=ti-(w.n-1)*7;
  const todo=w.ms.filter(m=>!S.done[m.id]);
  const today=todo.find(m=>m.day===wd); if(today) return {m:today,w,today:true};
  const after=todo.find(m=>m.day>=wd)||todo[0];
  if(after) return {m:after,w,today:false};
  if((S.foot[w.n]||0)<w.foot) return {m:{title:'Footing du matin 10–15′',detail:'Très léger, juste réveiller les jambes.',type:'foot',xp:XP.foot},w};
  return {m:{title:`Valider la semaine ${w.n}`,detail:`Bonus +${XP.perfect} XP`,type:'q'},w,validate:true};
}

}

function smoothPts(P,n=10){ const o=[]; for(let i=0;i<P.length-1;i++){ const p0=P[Math.max(0,i-1)],p1=P[i],p2=P[i+1],p3=P[Math.min(P.length-1,i+2)];
  for(let j=0;j<n;j++){ const u=j/n,u2=u*u,u3=u2*u; o.push([0,1].map(k=>.5*((2*p1[k])+(-p0[k]+p2[k])*u+(2*p0[k]-5*p1[k]+4*p2[k]-p3[k])*u2+(-p0[k]+3*p1[k]-3*p2[k]+p3[k])*u3))); } }
  o.push(P[P.length-1]); return o; }
function mkLine(P){ const pts=smoothPts(P), L=[0]; for(let i=1;i<pts.length;i++) L.push(L[i-1]+Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1])); return {pts,L,tot:L[L.length-1]}; }
function lineUpTo(ln,u){ const d=Math.max(0,Math.min(1,u))*ln.tot, out=[ln.pts[0]]; for(let i=1;i<ln.pts.length;i++){ if(ln.L[i]>=d){ const a=ln.pts[i-1],b=ln.pts[i],k=(d-ln.L[i-1])/((ln.L[i]-ln.L[i-1])||1); out.push([a[0]+(b[0]-a[0])*k,a[1]+(b[1]-a[1])*k]); return out; } out.push(ln.pts[i]); } return out; }

/* ---------- météo (Open-Meteo, sans clé) ---------- */
const r2=x=>Math.round(x*100)/100;
async function wxForActs(acts){
  const cache=LS.get('rtr-wx')||{}, lim=Date.now()-88*864e5;
  const runs=acts.filter(a=>ST_RUN.includes(a.type)&&a.ll);
  const last=runs[runs.length-1]; if(last) LS.set('rtr-wloc',[r2(last.ll[0]),r2(last.ll[1])]);
  const need=runs.filter(a=>!cache[a.id]&&new Date(a.start).getTime()>lim);
  const groups={}; need.forEach(a=>{const k=a.ll[0].toFixed(1)+','+a.ll[1].toFixed(1); (groups[k]=groups[k]||[]).push(a);});
  const keys=Object.keys(groups).sort((x,y)=>groups[y].length-groups[x].length).slice(0,4);
  for(const k of keys){ const [la,lo]=k.split(',');
    const r=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${la}&longitude=${lo}&hourly=temperature_2m,precipitation&past_days=92&forecast_days=1&timezone=auto`); if(!r.ok) continue;
    const h=(await r.json()).hourly, idx={}; h.time.forEach((x,i)=>idx[x]=i);
    groups[k].forEach(a=>{ const i=idx[a.start.slice(0,13)+':00']; if(i==null||h.temperature_2m[i]==null) return; cache[a.id]=[h.temperature_2m[i],Math.max(h.precipitation[i+1]||0,h.precipitation[i+2]||0)]; }); }
  LS.set('rtr-wx',cache);
  acts.forEach(a=>{ const c=cache[a.id]; if(c){ a.temp=c[0]; a.cond=c[1]>=0.2?'Rain':''; } });
}

function stravaStats(acts){
  const now=Date.now(), age=a=>(now-new Date(a.start).getTime())/864e5, cl=x=>Math.max(0,Math.min(1,x));
  const runs=acts.filter(a=>ST_RUN.includes(a.type)&&a.km>0);
  const r28=runs.filter(a=>age(a)<=28), r42=runs.filter(a=>age(a)<=42);
  const km28=r28.reduce((s,a)=>s+a.km,0), longest=r28.reduce((m,a)=>Math.max(m,a.km),0);
  const days=new Set(r28.map(a=>a.day)).size, str=acts.filter(a=>ST_STR.includes(a.type)&&age(a)<=28).length;
  let pred=null, src=null;
  r42.filter(a=>a.km>=5&&a.el>0).forEach(a=>{ const p=a.el*Math.pow(42.195/a.km,1.06); if(pred==null||p<pred){pred=p;src=a;} });
  const wk={}; runs.forEach(a=>{ const i=Math.floor((new Date(a.day+'T12:00:00')-START)/(7*864e5)); if(i>=0&&i<18) wk[i]=(wk[i]||0)+a.km; });
  return {wk,at:now,km28:Math.round(km28),longest:Math.round(longest*10)/10,days,str,
    fEnd:cl(0.6*cl(km28/4/65)+0.4*cl(longest/34)), fVit:pred?cl((13200-pred)/1500):null, fRec:cl(days/20), fFor:cl(str/8),
    pred:pred?Math.round(pred):null, predFrom:src?{km:Math.round(src.km*10)/10,day:src.day}:null};
}
function stravaMatch(acts){
  const c=calc(), w=c.cur; if(!w) return 0;
  S.src=S.src||{}; let n=0; const used=new Set();
  const base=new Date(ymd(w.start)+'T12:00:00');
  const di=a=>Math.round((new Date(a.day+'T12:00:00')-base)/864e5);
  const runs=acts.filter(a=>ST_RUN.includes(a.type)&&a.km>0&&di(a)>=0&&di(a)<=6);
  const runMs=w.ms.filter(m=>m.kind==='run');
  [0,1].forEach(tol=>runMs.forEach(m=>{
    if(S.done[m.id]) return;
    const need=m.type==='race'?40:Math.max(4.6,m.km*0.7);
    const cand=runs.filter(a=>!used.has(a.id)&&Math.abs(di(a)-m.day)<=tol&&a.km>=need).sort((x,y)=>y.km-x.km)[0];
    if(cand){ used.add(cand.id); S.done[m.id]=Date.now(); S.src[m.id]='strava'; n++;
      if(m.type==='race'&&!S.chrono) S.chrono=fmtChrono(cand.el); }
  }));
  const foots=new Set(runs.filter(a=>!used.has(a.id)&&a.km<=4.5).map(a=>a.day)).size;
  const cur=S.foot[w.n]||0, nf=Math.min(w.foot,Math.max(cur,foots)); if(nf>cur){ n+=nf-cur; S.foot[w.n]=nf; }
  const strN=acts.filter(a=>ST_STR.includes(a.type)&&di(a)>=0&&di(a)<=6).length;
  const mus=w.ms.filter(m=>m.kind==='muscu'); let extra=strN-mus.filter(m=>S.done[m.id]).length;
  mus.forEach(m=>{ if(extra>0&&!S.done[m.id]){ S.done[m.id]=Date.now(); S.src[m.id]='strava'; extra--; n++; } });
  return n;
}
function stravaFeats(acts,prev){
  const p={...(prev||{})}, s0=ymd(START);
  const runs=acts.filter(a=>ST_RUN.includes(a.type)&&a.km>0&&a.day>=s0);
  if(runs.some(a=>a.hour<7)) p.dawn=true;
  if(runs.some(a=>/rain|drizzle|shower|storm/i.test(a.cond))) p.rain=true;
  if(runs.some(a=>a.temp!=null&&a.temp<=0)) p.cold=true;
  const wk={}; runs.forEach(a=>{const i=Math.floor((new Date(a.day+'T12:00:00')-START)/(7*864e5)); wk[i]=(wk[i]||0)+a.km;});
  p.maxWeek=Math.max(p.maxWeek||0,...Object.values(wk),0);
  p.days=Math.max(p.days||0,new Set(runs.map(a=>a.day)).size);
  if(S.strava&&S.strava.pred&&S.strava.pred<12000) p.pred320=true;
  return p;
}

async function stravaSync(manual){
  if(syncing) return; syncing=true; render(tab);
  try{
    const acts=await stravaFetch(); wxNow(false); S.strava=stravaStats(acts); S.feats=stravaFeats(acts,S.feats); const n=stravaMatch(acts); save();
    if(n) sfx('check'); if(manual||n) toast(n?`Strava : ${n} validation${n>1?'s':''} ajoutée${n>1?'s':''}`:'Strava synchronisé · rien de nouveau à valider');
  }catch(e){ if(manual) toast(stravaErr(e)); }
  finally{ syncing=false; render(tab); }
}

const SND={on:true,mus:true,ctx:null,out:null};
try{ SND.on=localStorage.getItem('rtr-sound')!=='off'; SND.mus=localStorage.getItem('rtr-music')!=='off'; }catch(e){}
function actx(){
  if(SND.ctx) { if(SND.ctx.state==='suspended') SND.ctx.resume().catch(()=>{}); return SND.ctx; }
  try{ const C=window.AudioContext||window.webkitAudioContext; if(!C) return null; SND.ctx=new C();
    const comp=SND.ctx.createDynamicsCompressor(); SND.out=SND.ctx.createGain(); SND.out.gain.value=.55; SND.out.connect(comp); comp.connect(SND.ctx.destination);
  }catch(e){ SND.ctx=null; } return SND.ctx;
}
function tone(f,t0,d,o={}){
  const c=SND.ctx; const os=c.createOscillator(), g=c.createGain(); let node=os;
  os.type=o.type||'square'; os.frequency.setValueAtTime(f,t0); if(o.to) os.frequency.exponentialRampToValueAtTime(o.to,t0+d);
  if(o.lp){ const fl=c.createBiquadFilter(); fl.type='lowpass'; fl.frequency.setValueAtTime(o.lp,t0); if(o.lpTo) fl.frequency.exponentialRampToValueAtTime(o.lpTo,t0+d); fl.Q.value=o.q||6; os.connect(fl); node=fl; }
  const v=o.v||.18; g.gain.setValueAtTime(0.0001,t0); g.gain.exponentialRampToValueAtTime(v,t0+(o.a||.005)); g.gain.exponentialRampToValueAtTime(0.0001,t0+d);
  node.connect(g); g.connect(o.dest||SND.out); if(o.send&&MUS.send) g.connect(MUS.send); os.start(t0); os.stop(t0+d+.05);
}
function kick(t0,v=.9,dest){ tone(150,t0,.32,{type:'sine',to:42,v,a:.002,dest}); }
function hat(t0,v=.08,dest){ const c=SND.ctx, n=c.sampleRate*.05, b=c.createBuffer(1,n,c.sampleRate), d=b.getChannelData(0); for(let i=0;i<n;i++) d[i]=Math.random()*2-1;
  const s=c.createBufferSource(); s.buffer=b; const hp=c.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=7000; const g=c.createGain();
  g.gain.setValueAtTime(v,t0); g.gain.exponentialRampToValueAtTime(0.0001,t0+.05); s.connect(hp); hp.connect(g); g.connect(dest||SND.out); s.start(t0); }
const N=n=>440*Math.pow(2,(n-69)/12);
function swoosh(t0,d,f0,f1,v,dest){ const c=SND.ctx, n=Math.floor(c.sampleRate*d), b=c.createBuffer(1,n,c.sampleRate), x=b.getChannelData(0); for(let i=0;i<n;i++) x[i]=Math.random()*2-1;
  const s=c.createBufferSource(); s.buffer=b; const bp=c.createBiquadFilter(); bp.type='bandpass'; bp.Q.value=1.2; bp.frequency.setValueAtTime(f0,t0); bp.frequency.exponentialRampToValueAtTime(f1,t0+d);
  const g=c.createGain(); g.gain.setValueAtTime(.0001,t0); g.gain.exponentialRampToValueAtTime(v,t0+d*.85); g.gain.exponentialRampToValueAtTime(.0001,t0+d); s.connect(bp); bp.connect(g); g.connect(dest||SND.out); s.start(t0); }
/* ---------- musique générée : thème de l'écran titre + ambiance légère ---------- */
const MUS={mode:null,timer:null,step:0,next:0,dt:.1,bus:null,send:null};
function musBus(){ const c=SND.ctx; if(MUS.bus) return; MUS.bus=c.createGain(); MUS.bus.gain.value=.0001; MUS.bus.connect(SND.out);
  const dl=c.createDelay(1), fb=c.createGain(), wet=c.createGain(); dl.delayTime.value=.352; fb.gain.value=.34; wet.gain.value=.4;
  MUS.send=c.createGain(); MUS.send.connect(dl); dl.connect(fb); fb.connect(dl); dl.connect(wet); wet.connect(MUS.bus); }
const CH=[[45,3],[41,4],[48,4],[43,4]]; // La mineur, Fa, Do, Sol : [fondamentale, tierce]
function stepTitle(s,t){ const B=MUS.bus, bar=Math.floor(s/16)%4, i=s%16, [r,th]=CH[bar];
  if(i%4===0) kick(t,.75,B);
  if(i%4===2) hat(t,.07,B); else if(i%2===1) hat(t,.025,B);
  if(i%8===4) swoosh(t,.11,1500,2400,.09,B);
  if(i%4!==0) tone(N(r-12),t,.1,{type:'sawtooth',lp:520,v:.2,dest:B});
  if(i%2===0){ const pat=[0,7,12,th+12,19,th+12,12,7]; tone(N(r+24+pat[i/2]),t,.16,{type:'square',lp:2600,v:.045,dest:B,send:true}); }
  if(i===0) [r+12,r+12+th,r+19].forEach(n=>tone(N(n),t,MUS.dt*15.5,{type:'sawtooth',lp:1100,lpTo:600,v:.035,a:.05,dest:B}));
  if(s===60) swoosh(t,MUS.dt*4,400,5000,.05,B);
}
function stepAmb(s,t){ const B=MUS.bus, bar=Math.floor(s/16)%4, i=s%16, [r,th]=CH[bar];
  if(i===0){ [r+12,r+12+th,r+19,r+26].forEach(n=>tone(N(n),t,MUS.dt*16,{type:'triangle',lp:800,v:.05,a:.5,dest:B})); tone(N(r-12),t,MUS.dt*10,{type:'sine',v:.14,a:.05,dest:B}); }
  const pl={0:12,3:19,6:12+th,10:26,12:19}[i]; if(pl!=null) tone(N(r+24+pl),t,.5,{type:'sine',v:.045,dest:B,send:true});
  if(i%4===2) hat(t,.012,B);
}
function musTick(){ const c=SND.ctx; if(!c||!MUS.mode) return; let n=0;
  while(MUS.next<c.currentTime+.25&&n++<8){ try{ (MUS.mode==='title'?stepTitle:stepAmb)(MUS.step,MUS.next); }catch(e){} MUS.next+=MUS.dt; MUS.step=(MUS.step+1)%64; }
  if(MUS.next<c.currentTime) MUS.next=c.currentTime+.05; }
function musStart(mode){ if(!SND.on||!SND.mus||MUS.mode===mode) return; const c=actx(); if(!c) return; musBus();
  MUS.mode=mode; MUS.step=0; MUS.dt=mode==='title'?60/128/4:60/84/4; MUS.next=c.currentTime+.08;
  const g=MUS.bus.gain, now=c.currentTime; g.cancelScheduledValues(now); g.setValueAtTime(.0001,now); g.exponentialRampToValueAtTime(mode==='title'?.6:.42,now+(mode==='title'?.5:3));
  clearInterval(MUS.timer); MUS.timer=setInterval(musTick,80); musTick(); }
function musStop(fade=.5){ clearInterval(MUS.timer); MUS.mode=null; const c=SND.ctx; if(!c||!MUS.bus) return;
  const g=MUS.bus.gain, now=c.currentTime; g.cancelScheduledValues(now); g.setValueAtTime(Math.max(g.value,.0001),now); g.exponentialRampToValueAtTime(.0001,now+fade); }

function sfx(name){
  if(!SND.on) return; const c=actx(); if(!c) return; const t=c.currentTime+.02;
  try{ switch(name){
    case 'tap': tone(1500,t,.035,{v:.05}); break;
    case 'tab': tone(900,t,.05,{type:'triangle',to:1300,v:.08}); break;
    case 'check': tone(N(76),t,.07,{v:.12}); tone(N(83),t+.065,.22,{v:.12}); tone(N(95),t+.065,.25,{type:'triangle',v:.06}); break;
    case 'uncheck': tone(N(64),t,.08,{v:.08}); tone(N(57),t+.07,.14,{v:.08}); break;
    case 'foot': tone(N(81),t,.09,{type:'triangle',v:.12}); tone(N(88),t+.05,.12,{type:'triangle',v:.08}); break;
    case 'equip': tone(300,t,.18,{type:'sawtooth',to:1800,lp:900,lpTo:6000,v:.08}); tone(N(88),t+.16,.2,{type:'triangle',v:.08}); break;
    case 'week': kick(t); [60,64,67,72].forEach(n=>tone(N(n),t,.6,{type:'sawtooth',lp:2400,lpTo:500,v:.06})); hat(t+.23); hat(t+.47); break;
    case 'level': kick(t); [72,76,79,84,88,91].forEach((n,i)=>tone(N(n),t+i*.075,.18,{type:'square',lp:3500,v:.09})); [72,79,84,88].forEach(n=>tone(N(n),t+.48,.9,{type:'sawtooth',lp:3000,lpTo:600,v:.05})); kick(t+.47); break;
    case 'ach': [84,88,91,96].forEach((n,i)=>{ tone(N(n),t+i*.06,.9,{type:'sine',v:.1}); tone(N(n+12),t+i*.06,.5,{type:'triangle',v:.025}); }); [0,.18,.36].forEach((d,i)=>tone(N(103),t+.3+d,.25,{type:'sine',v:.04/(i+1)})); break;
    case 'world': { const b=60/128; tone(80,t,b*8,{type:'sawtooth',to:2400,lp:300,lpTo:7000,v:.05});
      for(let i=0;i<8;i++){ kick(t+i*b*.5,.6+i*.04); hat(t+i*b*.5+b*.25); }
      [57,64,69,72,76].forEach(n=>tone(N(n),t+b*4,1.4,{type:'sawtooth',lp:3500,lpTo:400,v:.06})); kick(t+b*4,1); break; }
    case 'enter': { swoosh(t,.28,500,6000,.1); tone(95,t+.26,.7,{type:'sine',to:34,v:.8,a:.004});
      [69,73,76,81,83,88].forEach((n,i)=>{ tone(N(n),t+.27+i*.045,1.5,{type:'triangle',v:.075}); tone(N(n+12),t+.27+i*.045,.8,{type:'sine',v:.03}); });
      [0,.16,.32].forEach((d,i)=>tone(N(100),t+.55+d,.3,{type:'sine',v:.035/(i+1)})); break; }
  } }catch(e){}
}

function showIntro(){
  const c=calc(), jx=Math.max(0,Math.ceil((RACE-new Date())/864e5));
  const d=document.createElement('div'); d.className='intro'; d.setAttribute('role','button'); d.setAttribute('aria-label','Entrer dans Road to Rome'); d.tabIndex=0;
  d.innerHTML=`<div class="in"><img src="${INTRO_ICON}" alt=""><h1>Road<br>to Rome</h1><div class="s2">SAISON 2 · PARIS → ROME</div>
    <div class="meta">Niv. ${c.level} · ${esc(c.rankName)} · J-${jx}</div><div class="ld"><i></i></div><div class="go">TOUCHE POUR COMMENCER</div></div>`;
  const enter=()=>{ if(d.classList.contains('out')) return; musStop(.45); sfx('enter'); d.classList.add('out'); setTimeout(()=>musStart('amb'),1300); setTimeout(()=>d.remove(),500); };
  d.addEventListener('click',e=>{ e.stopPropagation(); enter(); });
  d.addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); enter(); } });
  document.body.appendChild(d); setTimeout(()=>d.focus({preventScroll:true}),50); musStart('title');
}

/* ---------- réglages : musique et sauvegarde ---------- */
function settingsExtra(){ return `<h3 style="margin-top:18px;font-size:15px">Musique</h3>
  <div class="row" style="margin-top:8px"><button class="btn" data-act="music">Musique d’ambiance : ${SND.mus?'activée':'coupée'}</button></div>
  <h3 style="margin-top:18px;font-size:15px">Sauvegarde</h3>
  <p style="color:var(--muted);font-size:13px;margin:6px 0 0">Exporte ton code de sauvegarde et garde-le dans une note ou un e-mail. Il permet de retrouver ta progression après un changement de téléphone.</p>
  <div class="row" style="margin-top:10px"><button class="btn" data-act="bkexp">Exporter</button><button class="btn" data-act="bkimp">Restaurer</button></div>`; }
const bkCode=()=>'RTR1.'+btoa(unescape(encodeURIComponent(JSON.stringify(S))));
function bkRestore(txt){ const s=String(txt||'').replace(/\s+/g,''); if(!s.startsWith('RTR1.')) return false;
  let j; try{ j=JSON.parse(decodeURIComponent(escape(atob(s.slice(5))))); }catch(e){ return false; }
  if(!j||j.v!==1||typeof j.done!=='object'||typeof j.val!=='object') return false;
  S={...blank(),...j}; save(); lastLevel=null; lastAch=null; OVQ.length=0; viewWeek=null; return true; }

/* ================= EVENTS ================= */
document.addEventListener('click',e=>{
  const g=e.target.closest('[data-go]'); if(g){ sfx('tab'); if(g.dataset.go==='missions') viewWeek=null; if(g.dataset.go==='map'){ zoneN=null; zoneShown=null; selDot=null; } go(g.dataset.go); return; }
  const b=e.target.closest('[data-act]'); if(!b) return;
  const a=b.dataset.act;
  if(a==='toggle'){ const id=b.dataset.id; const m=WEEKS.flatMap(w=>w.ms).find(x=>x.id===id); if(S.done[id]){ delete S.done[id]; sfx('uncheck'); } else { S.done[id]=Date.now(); floatXP(b,'+'+m.xp+' XP'); sfx('check'); } save(); render(tab); }
  else if(a==='foot'){ const w=+b.dataset.w,i=+b.dataset.i,f=S.foot[w]||0; const nf=i<f?i:i+1; if(nf>f){ floatXP(b,'+'+(nf-f)*XP.foot+' XP'); sfx('foot'); } else sfx('uncheck'); S.foot[w]=nf; save(); render(tab); }
  else if(a==='wk'){ const c=calc(); const curN=c.cur?c.cur.n:18; const n=viewWeek+ +b.dataset.d; if(n>curN){ viewWeek=curN; renderMissions(); renderLockedWeekOnly(n); } else { viewWeek=Math.max(1,n); renderMissions(); } }
  else if(a==='validate'){ const c=calc(), w=c.cur, wd=weekDone(w);
    sheet(`<h3>Valider la semaine ${w.n} ?</h3><p style="color:var(--muted);margin:4px 0 0">${wd.all?`Semaine parfaite : <b style="color:var(--lime)">+${XP.perfect} XP</b> bonus.`:`${wd.n}/${wd.tot} missions faites. Bonus réduit : <b style="color:var(--lime)">+${XP.partial} XP</b>. Les missions non cochées ne rapporteront plus d’XP.`}</p>
      <p style="color:var(--muted);font-size:12px">${w.n<18?`La semaine ${w.n+1} apparaîtra ensuite.`:''}</p>
      <div class="row"><button class="btn" data-act="close">Annuler</button><button class="btn pri" data-act="doval">Valider</button></div>`); }
  else if(a==='doval'){ const c=calc(), w=c.cur, wd=weekDone(w); S.val[w.n]={perfect:wd.all,at:Date.now()}; save(); closeSheet(); sfx('week'); if(w.n===w.world.weeks[1]&&w.n<18) worldPop(w.world,WORLDS[w.world.n]); viewWeek=Math.min(18,w.n+1); render(tab); toast(w.n<18?`Semaine ${w.n} validée · la semaine ${w.n+1} est débloquée`:'Aventure terminée. Ave, Gladiateur !'); }
  else if(a==='strava'){ sfx('tap'); if(stConnected()) stravaSync(true); else toast('Connecte Strava dans les réglages (roue crantée du QG).'); }
  else if(a==='sound'){ SND.on=!SND.on; try{localStorage.setItem('rtr-sound',SND.on?'on':'off')}catch(e){} if(SND.on){ actx(); sfx('check'); musStart('amb'); } else musStop(.2); renderHome(); toast(SND.on?'Son activé':'Son coupé'); }
  else if(a==='ach'){ sfx('tap'); openAch(b.dataset.id); }
  else if(a==='music'){ SND.mus=!SND.mus; try{localStorage.setItem('rtr-music',SND.mus?'on':'off')}catch(e){} if(SND.mus) musStart('amb'); else musStop(.3); closeSheet(); toast(SND.mus?'Musique activée':'Musique coupée'); }
  else if(a==='bkexp'){ sheet(`<h3>Code de sauvegarde</h3><p style="color:var(--muted);font-size:13px;margin:6px 0 10px">Copie ce code et colle-le dans une note ou un e-mail. Refais un export de temps en temps.</p>
      <textarea id="bk-out" class="inp" rows="6" readonly style="font-size:11px;word-break:break-all">${bkCode()}</textarea>
      <div class="row"><button class="btn" data-act="close">Fermer</button><button class="btn pri" data-act="bkcopy">Copier</button></div>`); }
  else if(a==='bkcopy'){ const ta=$('#bk-out'); const sel=()=>{ ta.focus(); ta.select(); toast('Code sélectionné : fais Copier.'); }; try{ navigator.clipboard.writeText(ta.value).then(()=>toast('Code copié'),sel); }catch(e){ sel(); } }
  else if(a==='bkimp'){ sheet(`<h3>Restaurer une sauvegarde</h3><p style="color:var(--muted);font-size:13px;margin:6px 0 10px">Colle ton code de sauvegarde. Il remplace la progression actuelle de ce téléphone.</p>
      <textarea id="bk-in" class="inp" rows="6" placeholder="RTR1.…" style="font-size:11px;word-break:break-all"></textarea>
      <div class="row"><button class="btn" data-act="close">Annuler</button><button class="btn pri" data-act="bkdo">Restaurer</button></div>`); }
  else if(a==='bkdo'){ if(bkRestore($('#bk-in').value)){ closeSheet(); render(tab); toast('Progression restaurée'); } else toast('Ce code n’est pas valide. Vérifie qu’il est complet et commence par RTR1.'); }
  else if(a==='achclose'){ b.closest('.achview').remove(); }
  else if(a==='invf'){ invF=b.dataset.f; renderInv(); }
  else if(a==='close'){ closeSheet(); }
  else if(a==='lvok'){ sfx('tap'); b.closest('.lvlup').remove(); showNextOverlay(); }
  else if(a==='dot'){ selDot=+b.dataset.i; renderMap(); }
  else if(a==='zone'){ sfx('tab'); zoneN=Math.max(1,Math.min(5,zoneN+ +b.dataset.d)); selDot=null; renderMap(); }
  else if(a==='mapfull'){ sfx('equip'); openFullMap(); }
  else if(a==='mapclose'){ sfx('tap'); $('#mapfull')?.remove(); }
  else if(a==='slot'){ openSlot(b.dataset.k); }
  else if(a==='equip'){ sfx('equip'); const k=b.dataset.k,id=b.dataset.id; if(id) S.eq[k]=id; else delete S.eq[k]; { const p=S.feats=S.feats||{}; const g=gearBonus(); if(S.eq.shirt==='tee0') p.paris=true; if(Object.keys(S.eq).length>=10) p.fullset=true; if(Object.values(S.eq).some(x=>(ITEMS.find(i=>i.id===x)||{}).r===4)) p.epic=true; if(g.vit+g.end+g.rec+g.con>=25) p.opt=true; if(nWinterEq()>=4) p.winter=true; } save(); closeSheet(); renderInv(); }
  else if(a==='chrono'){ const v=$('#chrono').value.trim(); if(v&&!parseChrono(v)){ toast('Format attendu : 3:19:45, 3h19m45 ou 31945'); return; } S.chrono=v?fmtChrono(parseChrono(v)):null; save(); render(tab); toast(S.chrono?`Chrono enregistré : ${S.chrono}`:'Chrono effacé'); }
  else if(a==='settings'){ const ap=stApp()||{}; sheet(`<h3>Réglages</h3><p style="color:var(--muted);font-size:13px;margin:6px 0 0">Ta progression est sauvegardée sur ce téléphone.</p>
     <h3 style="margin-top:18px;font-size:15px">Strava</h3>
     ${stConnected()?`<p style="color:var(--lime);font-size:13px;margin:6px 0 0">Strava est connecté.</p><div class="row"><button class="btn" data-act="stoff">Déconnecter Strava</button></div>`
     :`<p style="color:var(--muted);font-size:13px;margin:6px 0 0">Saisis les identifiants de ton application Strava. Ils restent sur ce téléphone.</p>
     <label class="fld" for="st-id">Client ID</label><input id="st-id" class="inp" inputmode="numeric" autocomplete="off" value="${esc(ap.id||'')}">
     <label class="fld" for="st-sec">Client Secret</label><input id="st-sec" class="inp" type="password" autocomplete="off" value="${esc(ap.secret||'')}">
     <div class="row"><button class="btn pri" data-act="ston">Connecter Strava</button></div>`}
     ${settingsExtra()}
     <div class="row"><button class="btn danger" data-act="reset1">Réinitialiser la progression</button></div><div class="row"><button class="btn" data-act="close">Fermer</button></div>`); }
  else if(a==='ston'){ const id=$('#st-id').value.trim(), sec=$('#st-sec').value.trim(); if(!/^\d+$/.test(id)||sec.length<20){ toast('Vérifie le Client ID (un nombre) et le Client Secret.'); return; } LS.set('rtr-strava-app',{id,secret:sec}); stravaLogin(); }
  else if(a==='stoff'){ LS.del('rtr-strava-tok'); closeSheet(); toast('Strava déconnecté'); render(tab); }
  else if(a==='wxloc'){ wxLocate(); }
  else if(a==='wxref'){ wxNow(true); }
  else if(a==='reset1'){ sheet(`<h3>Tout effacer ?</h3><p style="color:var(--muted)">XP, missions, semaines validées et équipement repartent de zéro. Impossible d’annuler.</p><div class="row"><button class="btn" data-act="close">Annuler</button><button class="btn danger" data-act="reset2">Effacer</button></div>`); }
  else if(a==='reset2'){ S=blank(); save(); closeSheet(); lastLevel=null; lastAch=null; OVQ.length=0; viewWeek=null; render(tab); toast('Progression remise à zéro'); }
});
document.addEventListener('keydown',e=>{ if((e.key==='Enter'||e.key===' ')&&e.target.matches('.dot')){ e.preventDefault(); e.target.dispatchEvent(new MouseEvent('click',{bubbles:true})); } if(e.key==='Escape'){ closeSheet(); document.querySelector('.achview')?.remove(); } });
function renderLockedWeekOnly(n){
  const w=WEEKS[n-1];
  $('#s-missions .stack').innerHTML=`<div class="wknav"><button data-act="wk" data-d="0" aria-label="Semaine précédente">${ic('chevL')}</button>
    <div class="wkhead"><b>Semaine ${n} / 18</b><div>${fmt(w.start)} → ${fmt(w.end)} · Monde ${w.world.n} · ${esc(w.world.name)}</div></div><button disabled aria-label="Semaine suivante">${ic('chevR')}</button></div>
    <div class="card locked">${ic('lock')}<h3>Semaine verrouillée</h3><p>Valide la semaine ${n-1} pour faire apparaître ces missions.</p></div>`;
}

renderTabs(); renderHome(); calc() && (lastLevel=calc().level, lastRank=calc().por);
if(!/[?&](code|error)=/.test(location.search)) showIntro();
(async()=>{ const q=new URLSearchParams(location.search), code=q.get('code'), err=q.get('error');
  if(code||err) history.replaceState(null,'',APP_URL);
  if(err) setTimeout(()=>toast('Connexion Strava annulée.'),500);
  else if(code){ try{ await stToken({grant_type:'authorization_code',code}); toast('Strava connecté'); await stravaSync(true); }catch(e){ toast(stravaErr(e)); } }
  else if(stConnected()) setTimeout(()=>stravaSync(false),1500);
  wxNow(false);
})();
</script>


<script>if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));}</script>
</body>
