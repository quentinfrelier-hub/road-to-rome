<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#090b1c"><title>PROJECT ROMA — ASCENSION</title><style>
:root{--bg:#090b1c;--panel:#151831;--panel2:#1d2140;--text:#f4f2ff;--muted:#b6b3ce;--pink:#f542da;--cyan:#4ce9ff;--gold:#ffc56c;--green:#63f1af}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -10%,#39215b 0,transparent 48%),var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}button{font:inherit;cursor:pointer}button:focus-visible{outline:2px solid var(--cyan);outline-offset:3px}.app{max-width:540px;margin:auto;min-height:100dvh;padding:20px 17px 105px}header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:24px}h1{font-size:22px;font-style:italic;letter-spacing:.1em;line-height:1.05;margin:0}h1 span{color:var(--pink)}header small{font-size:10px;letter-spacing:.25em;color:var(--muted)}.eyebrow{color:var(--cyan);font-size:11px;letter-spacing:.18em;text-transform:uppercase;font-weight:800}h2{font-size:24px;margin:4px 0 18px}h3{margin:0 0 10px;font-size:16px}.card{background:linear-gradient(145deg,rgba(35,36,74,.96),rgba(17,20,43,.98));border:1px solid #55417c;border-radius:20px;padding:18px;margin:13px 0;box-shadow:0 8px 28px #0004}.hero{border-color:var(--pink);background:radial-gradient(circle at 78% 20%,#612563,transparent 55%),linear-gradient(140deg,#211b45,#10162e)}.row{display:flex;justify-content:space-between;align-items:center;gap:12px}.muted{color:var(--muted)}.big{font-size:30px;font-weight:850}.badge{border:1px solid #76559d;border-radius:99px;padding:4px 9px;font-size:12px}.progress{height:10px;border-radius:99px;background:#333451;overflow:hidden;margin:12px 0}.progress>div{height:100%;background:linear-gradient(90deg,var(--cyan),var(--pink));border-radius:inherit;transition:width .4s}.btn{background:linear-gradient(110deg,#8d30d8,#ee39b9);border:0;color:white;border-radius:12px;padding:10px 14px;font-weight:800}.btn:disabled{opacity:.5;cursor:default}.secondary{background:#252745;border:1px solid #76559d}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{text-align:center;background:#0c1027;border:1px solid #373963;border-radius:12px;padding:11px 4px}.stat b{display:block;font-size:19px;color:var(--cyan)}.avatar{font-size:85px;text-align:center;filter:drop-shadow(0 0 20px #e639b566)}.world{position:relative;padding-left:30px;border-left:3px solid #563c83;margin-left:13px;padding-bottom:22px}.world:before{content:'';position:absolute;left:-10px;top:0;width:16px;height:16px;border-radius:50%;background:#252747;border:2px solid #a764eb}.world.done:before{background:var(--green)}.world.active:before{background:var(--pink);box-shadow:0 0 14px var(--pink)}.world strong{display:block}.world small{color:var(--muted)}.mission{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid #41405f}.mission:last-child{border-bottom:0}.mission input{accent-color:var(--pink);width:23px;height:23px;flex:none}.mission label{flex:1;cursor:pointer}.mission label b{display:block}.xp{color:var(--gold);font-size:12px;white-space:nowrap}.slots{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.slot{padding:12px;border-radius:13px;border:1px solid #59477f;background:#14162d;text-align:left;color:var(--text)}.slot.active{border-color:var(--pink);box-shadow:0 0 10px #ef39b94a}.slot:disabled{opacity:.45}.slot b{display:block}.slot small{color:var(--muted)}.trophies{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.trophy{padding:14px 9px;border:1px solid #534672;border-radius:14px;text-align:center;background:#15172e}.trophy .icon{font-size:32px}.trophy.locked{filter:grayscale(.8);opacity:.5}.trophy strong{display:block;font-size:13px}.trophy small{color:var(--muted)}nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(540px,100%);display:grid;grid-template-columns:repeat(5,1fr);background:#0f1129ee;backdrop-filter:blur(15px);border-top:1px solid #6d3f87;padding:10px 4px max(10px,env(safe-area-inset-bottom));z-index:5}nav button{border:0;background:none;color:#b7b2cc;font-size:10px;display:flex;flex-direction:column;align-items:center;gap:3px}nav button span{font-size:23px}nav button.active{color:var(--pink);text-shadow:0 0 12px #f542da}#toast{position:fixed;bottom:95px;left:50%;transform:translateX(-50%);background:#3c205a;border:1px solid var(--pink);padding:12px 20px;border-radius:13px;z-index:8;box-shadow:0 0 25px #f542da55;display:none;white-space:nowrap} .note{font-size:12px;color:var(--muted)}.lockedFinal{border-color:var(--gold);text-align:center}.lockedFinal .icon{font-size:52px}.field{width:100%;background:#0d1028;color:white;border:1px solid #68628a;border-radius:9px;padding:10px}a{color:var(--cyan)}@media(max-width:360px){.app{padding-left:10px;padding-right:10px}.xp{font-size:10px}}
</style></head><body><div class="app"><header><div><h1>PROJECT <span>ROMA</span></h1><small>ASCENSION · 2027</small></div><span class="badge">⚡ MODE RPG</span></header><main id="main"></main></div><nav id="nav" aria-label="Navigation principale"></nav><div id="toast" role="status" aria-live="polite"></div><script>
const MISSIONS=[{id:'easy',title:'Footing facile',desc:'45 min · endurance fondamentale',xp:150},{id:'long',title:'Sortie longue',desc:'1 h 40 · allure aisée',xp:400},{id:'quality',title:'Séance qualité',desc:'3 × 10 min · allure marathon',xp:300},{id:'strength',title:'Renforcement',desc:'40 min · bas du corps',xp:200},{id:'recovery',title:'Récupération active',desc:'30 min · mobilité ou vélo',xp:150},{id:'nutrition',title:'Nutrition & hydratation',desc:'Préparer et tester son ravitaillement',xp:150}];
const WORLDS=[['L’Éveil','Paris','🗼'],['La Forge','Les plaines','🌲'],['Les Reliefs','Les montagnes','⛰️'],['L’Endurance','La traversée','🌊'],['Les Portes de Rome','Italie','🏛️']];
const ITEMS=[{id:'classic',name:'Chaussures classiques',slot:'Chaussures',icon:'👟',bonus:'Endurance +3',unlock:0},{id:'carbon',name:'Chaussures carbone',slot:'Chaussures',icon:'⚡',bonus:'Vitesse +10',unlock:500},{id:'cap',name:'Casquette noire',slot:'Tête',icon:'🧢',bonus:'Concentration +3',unlock:0},{id:'shokz',name:'Écouteurs conduction osseuse',slot:'Audio',icon:'🎧',bonus:'Concentration +5',unlock:800},{id:'flask',name:'Flasque souple',slot:'Hydratation',icon:'💧',bonus:'Endurance +5',unlock:300},{id:'vest',name:'Gilet d’hydratation',slot:'Hydratation',icon:'🎒',bonus:'Endurance +15',unlock:1300},{id:'shirt',name:'Tenue technique néon',slot:'Tenue',icon:'👕',bonus:'Récupération +8',unlock:2000}];
const KEY='project-roma-ascension-v1';const defaults={done:[],equipped:{Chaussures:'classic',Tête:'cap'},finished:false,time:'',tab:'qg'};let s;try{s={...defaults,...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch{s={...defaults}};s.done=Array.isArray(s.done)?s.done:[];s.equipped=s.equipped||{};
const xp=()=>MISSIONS.filter(m=>s.done.includes(m.id)).reduce((a,m)=>a+m.xp,0);const stage=()=>Math.min(5,Math.floor(xp()/450)+1);const pct=()=>Math.min(100,Math.round(xp()/2700*100));const world=()=>Math.min(4,Math.floor(pct()/20));const save=()=>localStorage.setItem(KEY,JSON.stringify(s));const bar=(v)=>`<div class="progress"><div style="width:${v}%"></div></div>`;const heading=(tag,title)=>`<div class="eyebrow">${tag}</div><h2>${title}</h2>`;const names=['Rookie','Runner régulier','Carbon Striker','Endurance Master','Marathon Cyber Finisher'];
function toast(msg){const e=document.getElementById('toast');e.textContent=msg;e.style.display='block';clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>e.style.display='none',2300)}
function qg(){return heading('Centre de commandement','QG du coureur')+`<section class="card hero"><div class="row"><div><div class="eyebrow">Personnage</div><h2 style="margin:4px 0">NIV. ${stage()}</h2><strong>${names[stage()-1]}</strong></div><div class="avatar" aria-label="Coureur">🏃🏻‍♂️</div></div><div class="row"><b>${xp()} XP</b><span class="muted">Prochain palier ${stage()===5?'MAX':stage()*450+' XP'}</span></div>${bar(stage()===5?100:(xp()%450)/450*100)}</section><section class="card"><div class="eyebrow">Quête principale</div><h3>MARATHON DE ROME · 2027</h3><div class="row"><span>🏁 42,195 km</span><span style="color:var(--gold)">Objectif 3 h 20</span></div><p class="note">Le Colisée se débloque après validation de la course réelle.</p></section><section class="stats"><div class="stat"><b>${s.done.length}/${MISSIONS.length}</b><small>Missions</small></div><div class="stat"><b>${xp()}</b><small>XP</small></div><div class="stat"><b>${pct()}%</b><small>Parcours</small></div></section><section class="card"><h3>Progression vers Rome</h3>${bar(pct())}<p class="muted">Monde ${world()+1}/5 · ${WORLDS[world()][0]}</p><button class="btn" onclick="go('missions')">Voir mes missions →</button></section>`}
function carte(){return heading('Voyage de Paris à Rome','Carte de l’aventure')+`<div class="card"><div class="row"><b>🏃‍♂️ Paris → Rome</b><span class="badge">${pct()} %</span></div>${bar(pct())}<p class="note">La carte avance selon l’XP des missions. L’arrivée au Colisée exige de terminer le marathon.</p></div><section class="card">${WORLDS.map((w,i)=>`<div class="world ${i<world()?'done':i===world()?'active':''}"><strong>${w[2]} Monde ${i+1} · ${w[0]}</strong><small>${w[1]} · ${i<world()?'✓ Terminé':i===world()?'En cours':'🔒 À venir'}</small></div>`).join('')}<div class="world ${s.finished?'done':''}"><strong>🏟️ Colisée · Gladiateur de Rome</strong><small>${s.finished?'🏆 Victoire débloquée':'🔒 Marathon réel à terminer'}</small></div></section>`}
function missions(){return heading('Ton entraînement','Journal des missions')+`<div class="card"><div class="row"><b>${s.done.length} / ${MISSIONS.length} missions validées</b><span class="xp">${xp()} XP</span></div>${bar(s.done.length/MISSIONS.length*100)}<p class="note">Séances de démonstration : remplace-les ensuite par ton véritable plan d’entraînement. Chaque mission ne rapporte de l’XP qu’une fois.</p>${MISSIONS.map(m=>`<div class="mission"><input type="checkbox" id="m-${m.id}" ${s.done.includes(m.id)?'checked':''} onchange="toggleMission('${m.id}')"><label for="m-${m.id}"><b>${m.title}</b><span class="muted">${m.desc}</span></label><span class="xp">+${m.xp} XP</span></div>`).join('')}</div><div class="card"><h3>La régularité avant la performance</h3><p class="muted">La récupération et la nutrition font aussi progresser ton avatar. Les points sont ludiques, pas des mesures physiologiques.</p></div>`}
function equip(){const unlocked=ITEMS.filter(i=>xp()>=i.unlock).length;return heading('Personnalise ton héros','Équipement')+`<div class="card hero"><div class="avatar">🏃🏻‍♂️</div><h3 style="text-align:center">Niveau ${stage()} · ${names[stage()-1]}</h3><p class="note" style="text-align:center">Version 1 : les objets équipés changent les bonus RPG. L’apparence du personnage sera personnalisable dans une version ultérieure.</p><div class="row"><b>Objets débloqués</b><span>${unlocked} / ${ITEMS.length}</span></div></div><section class="card"><h3>Mon inventaire</h3><div class="slots">${ITEMS.map(i=>{const ok=xp()>=i.unlock,active=s.equipped[i.slot]===i.id;return `<button class="slot ${active?'active':''}" ${ok?'':'disabled'} onclick="equipItem('${i.id}')"><div style="font-size:25px">${i.icon}</div><b>${i.name}</b><small>${ok?(active?'✓ Équipé · ':'')+i.bonus:'🔒 '+i.unlock+' XP requis'}</small></button>`}).join('')}</div></section><p class="note">Les bonus sont fictifs et n’affectent ni ta santé, ni la réussite de tes entraînements.</p>`}
function trophies(){const awards=[['🗼','L’Éveil',pct()>=20],['🌲','La Forge',pct()>=40],['⛰️','Les Reliefs',pct()>=60],['🌊','L’Endurance',pct()>=80],['🏛️','Portes de Rome',pct()>=100],['⚡','Première mission',s.done.length>=1],['🔥','Régularité',s.done.length>=4],['💧','Récupération',s.done.includes('recovery')],['❔','Succès secret',false]];return heading('Collection de succès','Trophées & badges')+`<section class="card lockedFinal"><div class="icon">${s.finished?'🏆':'🔒'}</div><h3 style="color:var(--gold)">GLADIATEUR DE ROME</h3><p>${s.finished?'Marathon terminé : transformation légendaire débloquée !':'Terminer le Marathon de Rome (42,195 km) pour débloquer la transformation.'}</p>${s.finished?`<p>Temps déclaré : ${s.time||'non renseigné'}</p>`:`<button class="btn" onclick="finishMarathon()">Valider mon marathon</button>`}</section><section class="card"><h3>Badges de monde et de progression</h3><div class="trophies">${awards.map(([icon,name,ok])=>`<div class="trophy ${ok?'':'locked'}"><div class="icon">${icon}</div><strong>${name}</strong><small>${ok?'✓ Débloqué':'🔒 Verrouillé'}</small></div>`).join('')}</div></section><p class="note">Le trophée « Gladiateur » récompense l’arrivée, quel que soit le chrono. Un objectif de 3 h 20 peut être distingué séparément.</p>`}
const tabs=[['qg','⌂','QG'],['carte','◇','Carte'],['missions','▤','Missions'],['equip','▣','Équipement'],['trophies','🏆','Trophées']];function go(t){s.tab=t;save();render();window.scrollTo({top:0,behavior:'smooth'})}function render(){document.getElementById('main').innerHTML=({qg,carte,missions,equip,trophies}[s.tab]||qg)();document.getElementById('nav').innerHTML=tabs.map(([id,icon,label])=>`<button class="${s.tab===id?'active':''}" onclick="go('${id}')" aria-label="${label}" aria-current="${s.tab===id?'page':'false'}"><span>${icon}</span>${label}</button>`).join('')}
function toggleMission(id){const m=MISSIONS.find(m=>m.id===id);if(!m)return;const has=s.done.includes(id);s.done=has?s.done.filter(x=>x!==id):[...s.done,id];save();render();toast(has?'Mission annulée':'Mission validée · +'+m.xp+' XP ⚡')}
function equipItem(id){const i=ITEMS.find(i=>i.id===id);if(!i||xp()<i.unlock)return;s.equipped[i.slot]=id;save();render();toast(i.name+' équipé · '+i.bonus)}
function finishMarathon(){if(!confirm('As-tu réellement terminé les 42,195 km du Marathon de Rome ?'))return;let time=prompt('Ton chrono (facultatif, ex. 03:20:00) :','')||'';if(time&&!/^\d{1,2}:\d{2}:\d{2}$/.test(time)){alert('Format attendu HH:MM:SS. Tu peux laisser vide.');return}s.finished=true;s.time=time;save();render();toast('🏆 Gladiateur de Rome débloqué !')}
render();</script></body></html>
